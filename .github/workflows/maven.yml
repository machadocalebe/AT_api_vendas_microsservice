name: Java CI with Maven

on:
  push:
    branches: [ "main", "atividade-calebe" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build fornecedores-service with Maven
      run: |
        cd fornecedores-service
        mvn clean install -DskipTests
